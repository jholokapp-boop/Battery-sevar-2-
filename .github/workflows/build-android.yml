name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK (Debug)
        run: ./gradlew assembleDebug

      - name: Build APK (Release)
        run: ./gradlew assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Battery-Saver-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Battery-Saver-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: List build outputs
        if: always()
        run: |
          echo "Debug APK:"
          ls -lh app/build/outputs/apk/debug/ || echo "Debug APK not found"
          echo ""
          echo "Release APK:"
          ls -lh app/build/outputs/apk/release/ || echo "Release APK not found"
